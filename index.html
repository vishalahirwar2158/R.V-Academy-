
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.V Academy</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172554;
}
header {
  background: #123b70;
  color: white;
  text-align: center;
  padding: 25px 10px;
}
header h1 { margin: 0; }
main {
  max-width: 700px;
  margin: 25px auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px #0001;
}
h2 { color: #123b70; }
input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
  border-radius: 7px;
}
input { border: 1px solid #aaa; }
button {
  background: #1764ad;
  color: white;
  border: none;
  font-size: 16px;
}
footer {
  text-align: center;
  padding: 20px;
  color: #555;
}
</style>
</head>
<body>
<header>
  <h1>R.V Academy</h1>
  <p>शिक्षा ही सफलता की कुंजी है</p>
</header>

<main>
  <section class="card">
    <h2>हमारी Academy में आपका स्वागत है!</h2>
    <p>यहाँ विद्यार्थियों को पढ़ाई के नोट्स और अध्ययन सामग्री मिलेगी।</p>
  </section>

  <section class="card">
    <h2>नोट्स खोजें</h2>
    <input id="search" placeholder="विषय या नोट्स खोजें">
    <div id="notes">अभी कोई नोट्स उपलब्ध नहीं हैं।</div>
  </section>
</main>

<footer>
  © 2026 R.V Academy
</footer>
</body>
  </html>
